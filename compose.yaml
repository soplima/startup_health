services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - sqlite_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/startup_health.db

  web:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_PROXY_TARGET=http://api:8000
    depends_on:
      - api

volumes:
  sqlite_data:
